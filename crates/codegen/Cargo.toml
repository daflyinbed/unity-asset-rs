[package]
name = "unity-asset-codegen"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "unity-asset-codegen"
path = "src/main.rs"

[lib]
name = "unity_asset_codegen"
path = "src/lib.rs"

[dependencies]
# TPK 解压
lz4_flex = "0.11"
brotli = "8"
lzma-rs = "0.3"
# 命名转换
heck = "0.5"
# 错误处理
thiserror = "2"
# 日志
log = "0.4"
env_logger = "0.11"
