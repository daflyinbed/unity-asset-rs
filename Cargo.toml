[package]
name = "unity-asset-rs"
version = "0.1.0"
edition = "2024"
# `cargo run` 默认跑这个 bin。
default-run = "unity-asset-rs"

[lib]
name = "unity_asset_rs"
path = "src/lib.rs"

[[bin]]
name = "unity-asset-rs"
path = "src/main.rs"

[features]
# 纹理导出（ASTC 解码 + PNG 编码）。默认开启，需要 image / texture-decoder-rs 重依赖；
# 关闭后主 crate 与 CLI 不引入它们（`export` 子命令在无 feature 时报不可用）。
default = ["export"]
export = ["dep:image", "dep:texture-decoder-rs", "dep:half"]

[dependencies]
bytes = "1"
lz4_flex = "0.11"
lzma-rs = "0.3"
flate2 = "1"
brotli = "8"
log = "0.4"
snafu = "0.8"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
unity-core = { path = "crates/unity-core" }
generated = { package = "unity-asset-generated", path = "crates/generated" }
lz4inv = { path = "crates/lz4inv" }
# ── export feature ──
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# features = ["crn"]：启用 crunch（CRN v1.04 → BC1/BC3 block）解码模块（拉 alloc，本主 crate 无影响）。
texture-decoder-rs = { path = "../../texture-decoder-rs", optional = true, features = ["crn"] }
# half（fp16 → fp32）：HDR 浮点未压缩格式（RHalf/RGHalf/RGBAHalf）解码用；
# 与 texture-decoder-rs 同源（后者也依赖 half），不引入新外部 crate。
half = { version = "2", default-features = false, features = ["bytemuck"], optional = true }

[dev-dependencies]
# 测试里构造 fp16 字面量（HDR 浮点格式单测）用；version/feature 对齐 export feature 的 half。
half = { version = "2", default-features = false, features = ["bytemuck"] }

[workspace]
members = ["crates/codegen", "crates/generated", "crates/lz4inv", "crates/unity-core"]
resolver = "3"

# debug/test 默认 opt-level=0 会让 TypeTree 解释器（src/typetree/interpret.rs）的
# 递归 Value 返回值临时不被优化掉，深嵌套 typetree 下每层 ~60B 栈消耗累计到 5-6MB，
# 溢出测试线程 2MB 默认栈。opt-level=1 足以触发栈槽复用 / 临时消除，从根上解决栈溢出
# （release 无此问题）。
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
