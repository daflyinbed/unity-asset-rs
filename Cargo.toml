[package]
name = "unity-asset-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "unity_asset_rs"
path = "src/lib.rs"

[[bin]]
name = "unity-asset-rs"
path = "src/main.rs"

[dependencies]
bytes = "1"
lz4_flex = "0.11"
log = "0.4"
snafu = "0.8"
env_logger = "0.11"
unity-core = { path = "crates/unity-core" }
generated = { package = "unity-asset-generated", path = "crates/generated" }

[workspace]
members = ["crates/codegen", "crates/generated", "crates/unity-core"]
resolver = "3"
